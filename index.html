      <li><a class="nav-item" style="cursor:pointer" onclick="window.location.href='fun-zone.html'">

        Chill Zone

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <!-- Sun -->
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <!-- Moon -->
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>

  <main class="card">
    <div class="avatar-ring">
      <div class="avatar-wrap">
        <img
          class="avatar"
          src="profile.jpeg"
          alt="Alwin Thomas"
        />
      </div>
    </div>

    <h1 class="name">Alwin Thomas</h1>
    <p class="role">Principal Architect,<br>JPMorgan Chase</p>

    <p class="bio">
      Hi, I'm a passionate technologist who loves building clean, useful software,
      leveraging the latest advancements in Artificial Intelligence.
    </p>

    <div class="links">
      <a
        class="btn-linkedin"
        href="https://www.linkedin.com/in/alwinthomas"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View LinkedIn profile"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#0a66c2" aria-hidden="true">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      </a>
    </div>

    <div class="divider"></div>

    <section class="contact">
      <h2>Get in touch</h2>
      <!-- Formspree: replace YOUR_FORM_ID after signing up at https://formspree.io -->
      <form class="form" id="contact-form">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Jane Smith" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Say hello…" required></textarea>
        </div>
        <button type="submit" class="btn btn-submit">Send message</button>
        <p class="form-status" id="form-status" aria-live="polite"></p>
      </form>
      <p class="sudoku-teaser" style="text-align:center">Bored? Try some <a class="sudoku-link" style="cursor:pointer" onclick="window.location.href='sudoku.html'">Sudoku</a>.</p>
    </section>
  </main>

  <footer class="visitor-counter" id="visitor-counter"></footer>

  <script>
    // ── Dark mode ─────────────────────────────────────────────
    const root = document.documentElement;
    const toggleBtn = document.getElementById('theme-toggle');

    const saved = localStorage.getItem('theme');
    if (saved) {
      root.setAttribute('data-theme', saved);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      root.setAttribute('data-theme', 'dark');
    }

    toggleBtn.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // ── Hamburger nav ─────────────────────────────────────────
    const hamburger = document.getElementById('hamburger');
    const navDrawer = document.getElementById('nav-drawer');
    const navOverlay = document.getElementById('nav-overlay');
    const navClose = document.getElementById('nav-close');

    function openNav() {
      navDrawer.classList.add('open');
      navOverlay.classList.add('open');
      hamburger.setAttribute('aria-expanded', 'true');
      navDrawer.setAttribute('aria-hidden', 'false');
    }

    function closeNav() {
      navDrawer.classList.remove('open');
      navOverlay.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
      navDrawer.setAttribute('aria-hidden', 'true');
    }

    hamburger.addEventListener('click', openNav);
    navClose.addEventListener('click', closeNav);
    navOverlay.addEventListener('click', closeNav);

    // ── Star cursor + Particle trail ──────────────────────────
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      const darkColors  = ['#818cf8','#38bdf8','#34d399','#f472b6','#fb923c'];
      const lightColors = ['#6366f1','#0ea5e9','#10b981','#ec4899','#f97316'];
      const star = document.createElement('div');
      star.id = 'star-cursor';
      star.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z"
          fill="#6366f1" stroke="#6366f1" stroke-width="0.5" stroke-linejoin="round"/></svg>`;
      document.body.appendChild(star);
      let spinTimer = null;
      document.addEventListener('mousemove', (e) => {
        star.style.left = e.clientX + 'px';
        star.style.top  = e.clientY + 'px';
        star.classList.add('spinning');
        clearTimeout(spinTimer);
        spinTimer = setTimeout(() => star.classList.remove('spinning'), 150);
      });
      document.addEventListener('mouseleave', () => star.style.opacity = '0');
      document.addEventListener('mouseenter', () => star.style.opacity = '1');
      let lastX = -999, lastY = -999;
      document.addEventListener('mousemove', (e) => {
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        if (Math.sqrt(dx*dx + dy*dy) < 12) return;
        lastX = e.clientX; lastY = e.clientY;
        const isDark = root.getAttribute('data-theme') === 'dark';
        const colors = isDark ? darkColors : lightColors;
        const dot = document.createElement('div');
        dot.className = 'trail-particle';
        const size = Math.random() * 6 + 4;
        dot.style.cssText = `width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${e.clientX}px;top:${e.clientY}px;opacity:${isDark?0.85:0.7}`;
        document.body.appendChild(dot);
        dot.addEventListener('animationend', () => dot.remove());
      });
    }

    // ── Contact form → Formspree ──────────────────────────────
    const FORMSPREE_ID = 'mvzbjenk';

    document.getElementById('contact-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const status = document.getElementById('form-status');
      const btn = this.querySelector('button[type="submit"]');

      btn.disabled = true;
      btn.textContent = 'Sending…';
      status.textContent = '';
      status.className = 'form-status';

      try {
        const res = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: new FormData(this),
        });

        if (res.ok) {
          status.textContent = 'Thanks! I\'ll get back to you soon.';
          status.classList.add('success');
          this.reset();
        } else {
          const data = await res.json();
          status.textContent = data?.errors?.[0]?.message || 'Something went wrong. Please try again.';
          status.classList.add('error');
        }
      } catch {
        status.textContent = 'Network error. Please try again.';
        status.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send message';
      }
    });
  </script>
  <script>
    // ── Visitor counter (retries on cold-start 404) ──
    (function () {
      const vcBase = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:8788' : 'https://claudecodeproject.onrender.com';
      const url = vcBase + '/visitor-count';
      const maxRetries = 3;

      function loadCount(attempt) {
        fetch(url)
          .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(data => {
            if (data.count != null) {
              document.getElementById('visitor-counter').textContent =
                String(data.count).padStart(6, '0').split('').join(' ');
            }
          })
          .catch(err => {
            if (attempt < maxRetries) {
              console.warn('Visitor counter attempt ' + attempt + ' failed, retrying in 3s...', err);
              setTimeout(() => loadCount(attempt + 1), 3000);
            } else {
              console.warn('Visitor counter failed after ' + maxRetries + ' attempts:', err);
            }
          });
      }
      loadCount(1);
    })();
  </script>

  <script src="cursor-halo.js"></script>
</body>
</html>
